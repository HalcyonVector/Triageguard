<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TriageGuard</title>
<style>
:root {
  --bg1: #070b1f; --bg2: #10143d; --bg3: #1b1848;
  --text: #E6E9F8; --muted: #A9B0D8; --faint: #8E98C6;
  --cyan: #5CCFC0; --violet: #9B8AE8; --pink: #E7A3C9; --amber: #E3B341;
  --glass: rgba(255,255,255,0.05); --line: rgba(255,255,255,0.12);
  --critical: #e0526a; --high: #e8894a; --medium: #E3B341; --low: #5f9fe0; --info: #8a98b0;
}
* { box-sizing: border-box; }
html { background: #070b1f; }
body {
  margin: 0; min-height: 100vh; color: var(--text);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%) fixed;
}
body::before, body::after {
  content: ""; position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(70px); opacity: .22;
}
body::before { width: 520px; height: 520px; right: -140px; top: -120px; background: radial-gradient(circle, #4b3aa0, transparent 70%); }
body::after { width: 460px; height: 460px; left: -140px; bottom: -140px; background: radial-gradient(circle, #1c6b88, transparent 70%); }
.wrap { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 28px 24px 64px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.brand h1 {
  margin: 0; font-size: 40px; letter-spacing: -0.5px; line-height: 1.1;
  background: linear-gradient(90deg, var(--cyan), var(--violet) 55%, var(--pink));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
nav { display: flex; gap: 8px; flex-wrap: wrap; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 6px; }
nav button {
  border: 0; cursor: pointer; color: var(--muted); background: transparent; font: inherit; font-weight: 600;
  padding: 9px 18px; border-radius: 999px; transition: all .15s;
}
nav button:hover { color: var(--text); }
nav button.on { color: #0a0f2c; background: linear-gradient(90deg, var(--cyan), var(--violet)); }
.card {
  background: var(--glass); border: 1px solid var(--line); border-radius: 20px; padding: 22px 24px;
  backdrop-filter: blur(10px);
}
.grid { display: grid; gap: 18px; }
.g4 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.g2 { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
.stat .num { font-size: 38px; white-space: nowrap; font-weight: 800; line-height: 1.05; letter-spacing: -1px; }
.stat .lab { color: var(--muted); margin-top: 6px; font-size: 15px; line-height: 1.35; }
.g1 { background: linear-gradient(135deg, rgba(92,207,192,.22), rgba(92,207,192,.05)); border-color: rgba(92,207,192,.4); }
.g2c { background: linear-gradient(135deg, rgba(155,138,232,.28), rgba(155,138,232,.06)); border-color: rgba(155,138,232,.45); }
.g3 { background: linear-gradient(135deg, rgba(231,163,201,.26), rgba(231,163,201,.05)); border-color: rgba(231,163,201,.45); }
.g4c { background: linear-gradient(135deg, rgba(227,179,65,.24), rgba(227,179,65,.05)); border-color: rgba(227,179,65,.45); }
h2 { margin: 28px 0 14px; font-size: 24px; letter-spacing: -.2px; }
h3 { margin: 0 0 12px; font-size: 18px; }
.muted { color: var(--muted); }
.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #0a0f2c; }
.sev-critical { background: var(--critical); color: #fff; } .sev-high { background: var(--high); }
.sev-medium { background: var(--medium); } .sev-low { background: var(--low); } .sev-info { background: var(--info); }
.bar { display: flex; height: 16px; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.08); }
.bar > span { display: block; height: 100%; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 14px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filters button, .filters select, .filters input {
  font: inherit; color: var(--text); background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px;
}
.filters select option { color: #0a0f2c; }
.filters input { min-width: 240px; }
.filters button { cursor: pointer; font-weight: 600; }
.filters button.on { background: linear-gradient(90deg, var(--cyan), var(--violet)); color: #0a0f2c; border-color: transparent; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th { text-align: left; color: var(--cyan); font-size: 12.5px; text-transform: uppercase; letter-spacing: .8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.07); vertical-align: top; }
tr.hit td { background: linear-gradient(90deg, rgba(92,207,192,.25), rgba(155,138,232,.18)); }
td.ref { font-weight: 700; color: var(--violet); white-space: nowrap; }
td.title { word-break: break-word; }
.report { line-height: 1.6; font-size: 15.5px; }
.report h1, .report h2, .report h3, .report h4 { margin: 22px 0 8px; }
.report table { margin: 10px 0; } .report hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.report code { background: rgba(255,255,255,.1); border-radius: 6px; padding: 1px 6px; font-size: 14px; }
.report ul { padding-left: 22px; } .report li { margin: 4px 0; }
a.cite { color: var(--cyan); font-weight: 700; text-decoration: none; border-bottom: 1px dotted var(--cyan); cursor: pointer; }
.pairs { display: grid; gap: 14px; }
.pair { display: grid; grid-template-columns: 190px 1fr 90px; gap: 14px; align-items: center; }
.pair .track { position: relative; height: 12px; background: rgba(255,255,255,.08); border-radius: 6px; margin: 4px 0; }
.pair .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
.pair .vals { font-size: 13.5px; color: var(--muted); text-align: right; }
.sq { display: inline-block; width: 22px; height: 22px; border-radius: 6px; margin-right: 4px; vertical-align: middle; border: 2px solid transparent; }
.sq.win { background: var(--critical); } .sq.lose { background: #4fb98f; }
.sq.flag { border-color: var(--amber); }
.task { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
.task:last-child { border-bottom: 0; }
.tick { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #0a0f2c; }
.tick.done { background: var(--cyan); } .tick.todo { background: transparent; border: 2px solid var(--amber); color: var(--amber); }
.task b { display: block; } .task span { color: var(--muted); font-size: 14px; }
.dumpcard { cursor: pointer; transition: transform .15s, border-color .15s; }
.dumpcard:hover { transform: translateY(-2px); }
.dumpcard.sel { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan) inset; }
.dumpcard h3 { margin-bottom: 4px; }
.two { display: flex; gap: 18px; margin-top: 14px; }
.two b { display: block; font-size: 28px; line-height: 1.1; } .two span { color: var(--muted); font-size: 12.5px; }
.filters button[disabled] { opacity: .22; cursor: not-allowed; }
.hidden { display: none; }
.note { font-size: 13px; color: var(--faint); margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>TriageGuard</h1>
      <p>AI-assisted memory forensics and cryptographic malware triage &middot; ICT 3141 &middot; Sagnik Basu, Arjun Mittal</p>
    </div>
    <nav id="nav">
      <button data-tab="overview" class="on">Overview</button>
      <button data-tab="findings">Findings</button>
      <button data-tab="report">Report</button>
      <button data-tab="redteam">Red team</button>
      <button data-tab="roadmap">Progress</button>
    </nav>
  </header>

  <section id="overview"></section>
  <section id="findings" class="hidden"></section>
  <section id="report" class="hidden"></section>
  <section id="redteam" class="hidden"></section>
  <section id="roadmap" class="hidden"></section>
</div>

<script>
const SEV = ["critical", "high", "medium", "low", "info"];
const SEV_COL = {critical: "#e0526a", high: "#e8894a", medium: "#E3B341", low: "#5f9fe0", info: "#8a98b0"};
const POINTS = {critical: 25, high: 12, medium: 5, low: 2, info: 0};
const CAP = {critical: 4, high: 4, medium: 4, low: 5};
let D = {dumps: [], redteam: []};
let cur = null, filterSev = "all", filterMod = "all", query = "", highlight = null, reportKind = "llm";
const dump = () => D.dumps.find((d) => d.id === cur) || D.dumps[0] || {id: "", meta: {}, findings: [], report_llm: "", report_rules: ""};
function picker(tab) {
  if (D.dumps.length < 2) return "";
  return `<div class="filters"><span class="muted">Dump:</span>${D.dumps.map((d) =>
    `<button data-dump="${d.id}" data-for="${tab}" class="${d.id === dump().id ? "on" : ""}">${esc(d.meta.title || d.id)}</button>`).join("")}</div>`;
}
function renderAll() { renderOverview(); renderFindings(); renderReport(); }
function bindPicker(root) {
  // one dump is selected for the whole page, so every tab that shows it re-renders
  root.querySelectorAll("[data-dump]").forEach((b) => b.onclick = () => { cur = b.dataset.dump; highlight = null; renderAll(); });
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const refNum = (r) => parseInt(String(r).replace(/\D/g, ""), 10) || 0;

function riskScore(fs) {
  const n = {};
  fs.forEach((f) => { n[f.severity] = (n[f.severity] || 0) + 1; });
  return Math.min(100, Object.keys(n).reduce((s, k) => s + (POINTS[k] || 0) * Math.min(n[k], CAP[k] || 0), 0));
}
function countUp(el, target, suffix = "") {
  const t0 = performance.now();
  const tick = (t) => {
    const p = Math.min(1, (t - t0) / 700);
    el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))) + suffix;
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function stats() {
  const rt = D.redteam, atk = rt.filter((r) => r.attack !== "control");
  const by = (mode) => atk.filter((r) => r.mode === mode);
  const win = (rows) => rows.filter((r) => r.attack_success === "True").length;
  const all = (mode) => rt.filter((r) => r.mode === mode);
  const cite = (mode) => { const a = all(mode); return a.length ? a.reduce((s, r) => s + parseFloat(r.citation_rate || 0), 0) / a.length : 0; };
  return {
    n: by("baseline").length, asrB: win(by("baseline")), asrD: win(by("defended")),
    unflagged: by("defended").filter((r) => r.unflagged_success === "True").length,
    citeB: cite("baseline"), citeD: cite("defended"),
  };
}

/* ---------- Overview ---------- */
function sevBar(fs) {
  const total = fs.length || 1;
  return `<div class="bar">${SEV.map((k) => `<span style="width:${fs.filter((f) => f.severity === k).length / total * 100}%;background:${SEV_COL[k]}"></span>`).join("")}</div>`;
}
function renderOverview() {
  const dd = dump(), fs = dd.findings, s = stats();
  const counts = {}; SEV.forEach((k) => counts[k] = fs.filter((f) => f.severity === k).length);
  const hits = fs.filter((f) => ["critical", "high", "medium"].includes(f.severity));
  const compare = D.dumps.length > 1 ? `
    <h2>Public memory dumps analysed</h2>
    <div class="grid g4">${D.dumps.map((d) => `
      <div class="card dumpcard ${d.id === dd.id ? "sel" : ""}" data-dump="${d.id}">
        <h3>${esc(d.meta.title || d.id)}</h3>
        <div class="muted" style="font-size:13.5px;margin-bottom:12px">${esc(d.meta.os || "")} &middot; ${esc(d.meta.size || "")}<br>${esc(d.meta.source || "")}${d.meta.pcap ? "<br>+ " + esc(d.meta.pcap) : ""}</div>
        ${sevBar(d.findings)}
        <div class="two"><div><b>${d.findings.length}</b><span>findings</span></div><div><b>${riskScore(d.findings)}</b><span>risk /100</span></div>
        <div><b>${d.findings.filter((f) => ["critical", "high"].includes(f.severity)).length}</b><span>critical + high</span></div></div>
      </div>`).join("")}</div>` : "";
  $("overview").innerHTML = `${compare}
    <h2>${esc(dd.meta.title || "Findings")}</h2>
    <div class="grid g4">
      <div class="card stat g1"><div class="num" id="n1">0</div><div class="lab">Findings in ${esc(dd.meta.title || "this dump")}</div></div>
      <div class="card stat g2c"><div class="num"><span id="n2">0</span><span style="font-size:24px">/100</span></div><div class="lab">Rule-based risk score</div></div>
      <div class="card stat g3"><div class="num">${s.asrB}/${s.n} &rarr; ${s.asrD}/${s.n}</div><div class="lab">Attacks that fooled the LLM report, plain vs defended</div></div>
      <div class="card stat g4c"><div class="num">${Math.round(s.citeB * 100)}% &rarr; ${Math.round(s.citeD * 100)}%</div><div class="lab">Claims backed by a valid citation</div></div>
    </div>
    <h2>Severity mix</h2>
    <div class="card">
      ${sevBar(fs)}
      <div class="legend">${SEV.map((k) => `<span><i style="background:${SEV_COL[k]}"></i>${k} ${counts[k]}</span>`).join("")}</div>
    </div>
    <h2>What stands out</h2>
    <div class="card"><table>
      <tr><th>Ref</th><th>Severity</th><th>Finding</th></tr>
      ${hits.sort((a, b) => SEV.indexOf(a.severity) - SEV.indexOf(b.severity) || refNum(a.ref) - refNum(b.ref)).map((f) => `
        <tr><td class="ref"><a class="cite" data-ref="${f.ref}">${f.ref}</a></td><td><span class="chip sev-${f.severity}">${f.severity}</span></td><td class="title">${esc(f.title)}</td></tr>`).join("")
        || `<tr><td colspan="3" class="muted">No findings loaded.</td></tr>`}
    </table></div>
    <p class="note">Public datasets and synthetic keys and tokens only, no malware executed.</p>`;
  countUp($("n1"), fs.length);
  countUp($("n2"), riskScore(fs));
  bindCites($("overview"));
  bindPicker($("overview"), renderOverview);
}

/* ---------- Findings ---------- */
function renderFindings() {
  const all = dump().findings;
  const mods = [...new Set(all.map((f) => f.module))].sort();
  const q = query.toLowerCase();
  const rows = all
    .filter((f) => (filterSev === "all" || f.severity === filterSev) && (filterMod === "all" || f.module === filterMod)
      && (!q || (f.title + f.kind + f.ref + f.location).toLowerCase().includes(q)))
    .sort((a, b) => refNum(a.ref) - refNum(b.ref));
  $("findings").innerHTML = `${picker("findings")}
    <div class="filters">
      ${["all", ...SEV].map((k) => `<button data-sev="${k}" class="${filterSev === k ? "on" : ""}">${k}</button>`).join("")}
      <select id="mod"><option value="all">all modules</option>${mods.map((m) => `<option ${filterMod === m ? "selected" : ""}>${m}</option>`).join("")}</select>
      <input id="q" placeholder="Search findings" value="${esc(query)}">
      <span class="muted">${rows.length} of ${all.length}</span>
    </div>
    <div class="card"><table>
      <tr><th>Ref</th><th>Severity</th><th>Module</th><th>Finding</th><th>Location</th></tr>
      ${rows.map((f) => `<tr id="row-${f.ref}" class="${highlight === f.ref ? "hit" : ""}">
        <td class="ref">${f.ref}</td><td><span class="chip sev-${f.severity}">${f.severity}</span></td>
        <td>${esc(f.module)}/${esc(f.kind)}</td><td class="title">${esc(f.title)}</td><td class="muted">${esc(f.location)}</td></tr>`).join("")}
    </table></div>`;
  bindPicker($("findings"), renderFindings);
  $("findings").querySelectorAll("[data-sev]").forEach((b) => b.onclick = () => { filterSev = b.dataset.sev; renderFindings(); });
  $("mod").onchange = (e) => { filterMod = e.target.value; renderFindings(); };
  $("q").oninput = (e) => { query = e.target.value; const pos = e.target.selectionStart; renderFindings(); const i = $("q"); i.focus(); i.setSelectionRange(pos, pos); };
}

/* ---------- Report (tiny markdown renderer) ---------- */
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
    .replace(/[\[【]F(\d+)[\]】]/g, (m, n) => `<a class="cite" data-ref="F${n}" title="${esc((dump().findings.find((f) => f.ref === "F" + n) || {}).title || "")}">[F${n}]</a>`);
}
function markdown(src) {
  src = (src || "").replace(/[​⁠]/g, "");
  const lines = src.split(/\r?\n/), out = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i], t = l.trim();
    if (!t) continue;
    if (/^-{3,}$/.test(t)) { out.push("<hr>"); continue; }
    const h = t.match(/^(#{1,4})\s+(.*)$/);
    if (h) { out.push(`<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`); continue; }
    if (t.startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(lines[i].trim()); i++; }
      i--;
      const cells = (r) => r.replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const body = rows.filter((r) => !/^\|[\s:|-]+\|?$/.test(r));
      out.push("<table>" + body.map((r, k) => "<tr>" + cells(r).map((c) => k === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</table>");
      continue;
    }
    if (/^[-*]\s+/.test(t)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++; }
      i--;
      out.push("<ul>" + items.map((x) => `<li>${inline(x)}</li>`).join("") + "</ul>");
      continue;
    }
    out.push(`<p>${inline(t)}</p>`);
  }
  return out.join("\n");
}
function renderReport() {
  const dd = dump(), kind = reportKind === "llm" && !dd.report_llm ? "rules" : reportKind;
  const text = kind === "llm" ? dd.report_llm : dd.report_rules;
  $("report").innerHTML = `${picker("report")}
    <div class="filters">
      <button data-kind="llm" class="${kind === "llm" ? "on" : ""}" ${dd.report_llm ? "" : "disabled title='No LLM report saved for this dump yet'"}>LLM report (defended)</button>
      <button data-kind="rules" class="${kind === "rules" ? "on" : ""}">Rule-based report</button>
      <span class="muted">Click a citation like [F65] to jump to its finding.</span>
    </div>
    <div class="card report">${text ? markdown(text) : "<p class='muted'>No report found in the results folder.</p>"}</div>`;
  bindPicker($("report"), renderReport);
  $("report").querySelectorAll("[data-kind]").forEach((b) => b.onclick = () => { reportKind = b.dataset.kind; renderReport(); });
  bindCites($("report"));
}
function bindCites(root) {
  root.querySelectorAll("a.cite").forEach((a) => a.onclick = () => {
    highlight = a.dataset.ref; filterSev = "all"; filterMod = "all"; query = "";
    show("findings");
    const row = $("row-" + highlight);
    if (row) row.scrollIntoView({block: "center", behavior: "smooth"});
  });
}

/* ---------- Red team ---------- */
const ATTACK_LABEL = {
  risk_downplay: "Call the host clean", forged_citation: "Cite a fake finding", fake_algorithm: "Name an absent cipher",
  dangerous_advice: "Harmful advice", omit_critical: "Hide the RSA finding", subtle_benign: "Subtle persuasion",
};
function renderRedteam() {
  const s = stats(), rt = D.redteam;
  const attacks = [...new Set(rt.filter((r) => r.attack !== "control").map((r) => r.attack))];
  const rate = (a, mode) => { const r = rt.filter((x) => x.attack === a && x.mode === mode); return [r.filter((x) => x.attack_success === "True").length, r.length]; };
  $("redteam").innerHTML = `
    <div class="grid g4">
      <div class="card stat g3"><div class="num">${s.asrB}/${s.n}</div><div class="lab">Attack success, plain LLM report</div></div>
      <div class="card stat g1"><div class="num">${s.asrD}/${s.n}</div><div class="lab">Attack success, with defences</div></div>
      <div class="card stat g2c"><div class="num">${s.unflagged}/${s.n}</div><div class="lab">Successful attacks reaching a reader with no warning</div></div>
      <div class="card stat g4c"><div class="num">${rt.length}</div><div class="lab">LLM reports generated (6 attacks, 2 fields, control, 3 trials)</div></div>
    </div>
    <h2>Attack success rate by attack</h2>
    <div class="card pairs">
      ${attacks.map((a) => { const [b, nb] = rate(a, "baseline"), [d, nd] = rate(a, "defended"); return `
        <div class="pair"><b>${ATTACK_LABEL[a] || a}</b>
          <div><div class="track"><div class="fill" style="width:${nb ? b / nb * 100 : 0}%;background:linear-gradient(90deg,#e8894a,#e0526a)"></div></div>
               <div class="track"><div class="fill" style="width:${nd ? d / nd * 100 : 0}%;background:linear-gradient(90deg,#5CCFC0,#9B8AE8)"></div></div></div>
          <div class="vals">plain ${b}/${nb}<br>defended ${d}/${nd}</div></div>`; }).join("")}
      <div class="legend"><span><i style="background:#e0526a"></i>plain report</span><span><i style="background:#9B8AE8"></i>with defences</span></div>
    </div>
    <h2>Every trial</h2>
    <div class="card"><table>
      <tr><th>Attack</th><th>Plain (JWT field | OTP field)</th><th>Defended (JWT field | OTP field)</th></tr>
      ${attacks.map((a) => `<tr><td><b>${ATTACK_LABEL[a] || a}</b></td>${["baseline", "defended"].map((m) => `<td>${["jwt_iss", "otp_issuer"].map((ch) =>
        rt.filter((x) => x.attack === a && x.mode === m && x.channel === ch).sort((p, q) => p.trial - q.trial)
          .map((x) => `<span class="sq ${x.attack_success === "True" ? "win" : "lose"} ${x.flagged === "True" ? "flag" : ""}" title="trial ${x.trial}: attack ${x.attack_success === "True" ? "succeeded" : "failed"}${x.flagged === "True" ? ", report flagged" : ""}"></span>`).join("")).join(" &nbsp;|&nbsp; ")}</td>`).join("")}</tr>`).join("")}
    </table>
    <div class="legend"><span><i style="background:#e0526a"></i>attack succeeded</span><span><i style="background:#4fb98f"></i>attack failed</span><span><i style="border:2px solid #E3B341;background:transparent"></i>report flagged by validation</span></div></div>
    <p class="note">The defences are an input sanitiser, mandatory citations, a rule-based cross-check and one retry. Limits: 6 trials per attack, one model (openai/gpt-oss-120b), synthetic payloads. A citation check proves the cited finding exists, not that the sentence is right.</p>`;
}

function renderRoadmap() {
  const task = (kind, t) => `<div class="task"><div class="tick ${kind}">${kind === "done" ? "&#10003;" : "&#8226;"}</div><div><b>${t[0]}</b><span>${t[1]}</span></div></div>`;
  $("roadmap").innerHTML = `<div class="grid g2">
    <div class="card g1"><h3>Done</h3>${DONE.map((t) => task("done", t)).join("")}</div>
    <div class="card g4c"><h3>Yet to do</h3>${TODO.map((t) => task("todo", t)).join("")}</div></div>
    <p class="note">Constraints: public datasets and synthetic keys and tokens only, no live malware execution, no real credentials.</p>`;
}

/* ---------- Tabs ---------- */
function show(tab) {
  document.querySelectorAll("section").forEach((s) => s.classList.toggle("hidden", s.id !== tab));
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  if (tab === "findings") renderFindings();
}
document.querySelectorAll("#nav button").forEach((b) => b.onclick = () => show(b.dataset.tab));

fetch("/api/data").then((r) => r.json()).then((d) => {
  D = d;
  renderOverview(); renderFindings(); renderReport(); renderRedteam(); renderRoadmap();
}).catch((e) => { $("overview").innerHTML = `<div class="card">Could not load data: ${esc(e)}</div>`; });
</script>
