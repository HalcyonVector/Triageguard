<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TriageGuard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: sticky sidebar (views + dump picker) and a main column. The home view is a
   comparison board across dumps; each dump's pages use the analyst-console look. */
:root {
  --bg: #070b14; --bg2: #0c1222; --glow1: rgba(79,209,192,0.16); --glow2: rgba(122,108,240,0.16); --glow3: rgba(255,92,116,0.10);
  --panel: rgba(17,24,39,0.72); --panel2: rgba(255,255,255,0.06); --line: rgba(148,163,196,0.16); --line2: rgba(148,163,196,0.08);
  --text: #e3e8f3; --muted: #9aa5bf; --faint: #7a86a3;
  --accent: #4fd1c0; --accent2: #8fa3f5; --warn: #e8c25a; --bad: #ff5c74; --good: #5fd38d;
  --critical: #ff5c74; --high: #ff9a4d; --medium: #e8c25a; --low: #5fa3ea; --info: #7d8aa7;
  --compromise: #ff6b81; --exposure: #f2b33d; --ink-on-accent: #04110f;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; color: var(--text); font: 15px/1.5 var(--sans);
  background:
    radial-gradient(1100px 620px at 8% -10%, var(--glow1), transparent 62%),
    radial-gradient(900px 700px at 105% 8%, var(--glow2), transparent 60%),
    radial-gradient(800px 600px at 60% 115%, var(--glow3), transparent 65%),
    linear-gradient(var(--line2) 1px, transparent 1px),
    linear-gradient(90deg, var(--line2) 1px, transparent 1px),
    linear-gradient(160deg, var(--bg) 0%, var(--bg2) 55%, var(--bg) 100%);
  background-size: auto, auto, auto, 48px 48px, 48px 48px, auto;
  background-attachment: fixed;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 24px 16px; display: flex; flex-direction: column; gap: 20px;
  border-right: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(10px); overflow-y: auto; }
.logo { display: flex; gap: 11px; align-items: center; padding: 2px 4px; }
.logo svg { flex: none; width: 34px; height: 38px; }
.logo .word { font: 700 18px/1.1 var(--sans); letter-spacing: -.3px; }
.logo .word span { color: var(--accent); font-weight: 600; }
.logo small { display: block; color: var(--faint); font: 10px var(--mono); letter-spacing: 1.2px; text-transform: uppercase; margin-top: 3px; }
.label { font: 600 10.5px var(--mono); letter-spacing: 1.5px; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
nav { display: flex; flex-direction: column; gap: 2px; }
nav button, .dumpbtn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; cursor: pointer; font: inherit; font-size: 14px;
  color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 9px; padding: 8px 11px; transition: background .15s, color .15s; }
nav button:hover, .dumpbtn:hover { color: var(--text); background: var(--panel2); }
nav button.on { color: var(--text); background: var(--panel2); border-color: var(--line); box-shadow: inset 2px 0 0 var(--accent); }
nav button svg { flex: none; width: 16px; height: 16px; stroke: var(--accent); fill: none; stroke-width: 1.8; }
.dumpbtn { flex-direction: column; align-items: stretch; gap: 4px; }
.dumpbtn.on { color: var(--text); background: var(--panel2); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.dumpbtn .t { font-weight: 600; font-size: 13.5px; }
.dumpbtn .s { display: flex; justify-content: space-between; font: 11.5px var(--mono); color: var(--faint); }
.side .foot { margin-top: auto; font-size: 11.5px; color: var(--faint); line-height: 1.5; display: grid; gap: 10px; }
main { padding: 28px 36px 70px; max-width: 1260px; width: 100%; min-width: 0; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
.top h1 { margin: 0; font-size: 28px; letter-spacing: -.4px; font-weight: 650; text-wrap: balance; }
.top .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
.pill { display: inline-flex; align-items: center; gap: 8px; font: 11.5px var(--mono); letter-spacing: .6px; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 999px; padding: 5px 12px; background: color-mix(in srgb, var(--accent) 8%, transparent); }
.pill.all { color: var(--accent2); border-color: color-mix(in srgb, var(--accent2) 40%, transparent); background: color-mix(in srgb, var(--accent2) 8%, transparent); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-width: 0; backdrop-filter: blur(6px); }
.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.g2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.split { display: grid; gap: 14px; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
h2 { margin: 28px 0 12px; font: 600 12.5px var(--mono); letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
h3 { margin: 0 0 10px; font-size: 16px; font-weight: 600; }
.muted { color: var(--muted); } .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.note { font-size: 12.5px; color: var(--faint); margin: 10px 0 0; line-height: 1.55; }
.hidden { display: none !important; }

/* board */
.dumpcard { cursor: pointer; display: grid; gap: 12px; transition: border-color .15s, transform .15s; text-align: left; font: inherit; color: inherit; }
.dumpcard:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.dumpcard.sel { border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent), 0 10px 30px var(--glow1); }
.dumpcard .hd { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.dumpcard h3 { margin: 0; }
.dumpcard .m { color: var(--faint); font-size: 12px; line-height: 1.5; }
.dumpcard .score { font: 700 40px/1 var(--mono); letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.band { display: inline-block; font: 600 10.5px var(--mono); letter-spacing: 1px; text-transform: uppercase; border: 1px solid currentColor; border-radius: 6px; padding: 2px 7px; }
.ce { display: grid; gap: 6px; }
.ce .r { display: grid; grid-template-columns: 92px 1fr 30px; gap: 8px; align-items: center; font: 12px var(--mono); color: var(--muted); }
.ce .r b { color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
.track { height: 7px; border-radius: 4px; background: var(--panel2); position: relative; overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.kv { display: flex; justify-content: space-between; gap: 10px; font: 12px var(--mono); color: var(--faint); }
.heat { overflow-x: auto; }
.heat table { min-width: 560px; }
.heat td.cell { text-align: center; font: 600 13px var(--mono); border-radius: 6px; padding: 10px 6px; }
.heat td.h { font: 600 13px var(--sans); white-space: nowrap; }
.heatwrap { border-collapse: separate; border-spacing: 4px; }
.heatwrap td, .heatwrap th { border: 0; }

/* severity, tables, chips */
.chip { display: inline-block; font: 600 10.5px var(--mono); letter-spacing: .7px; text-transform: uppercase; border-radius: 6px; padding: 2px 7px; border: 1px solid currentColor; white-space: nowrap; }
.sev-critical { color: var(--critical); } .sev-high { color: var(--high); } .sev-medium { color: var(--medium); } .sev-low { color: var(--low); } .sev-info { color: var(--info); } .sev-none { color: var(--faint); }
.tag { display: inline-block; font: 10.5px var(--mono); letter-spacing: .6px; text-transform: uppercase; border-radius: 6px; padding: 2px 7px; border: 1px solid var(--line); color: var(--muted); }
.tag.ok { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); } .tag.flag { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
.tq { display: inline-block; font: 600 11px var(--mono); color: var(--accent2); border: 1px solid color-mix(in srgb, var(--accent2) 40%, transparent); border-radius: 5px; padding: 1px 6px; margin: 1px 3px 1px 0; white-space: nowrap; }
.sevbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--panel2); gap: 2px; }
.sevbar span { display: block; height: 100%; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font: 12px var(--mono); color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--faint); font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: 1.1px; padding: 8px 10px 10px; border-bottom: 1px solid var(--line); }
td { padding: 10px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.hit td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
td.ref { font: 600 13px var(--mono); color: var(--accent2); white-space: nowrap; }
td.title { word-break: break-word; } td.num, th.num { text-align: right; }
a.cite { color: var(--accent); font-family: var(--mono); font-size: .92em; text-decoration: none; border-bottom: 1px dotted var(--accent); cursor: pointer; }
.conf { display: flex; align-items: center; gap: 12px; }
.conf .v { font-family: var(--mono); min-width: 56px; text-align: right; font-variant-numeric: tabular-nums; }
.meter { flex: 1; min-width: 90px; height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 55%, transparent), var(--accent)); }
.meter.bad i { background: linear-gradient(90deg, color-mix(in srgb, var(--bad) 55%, transparent), var(--bad)); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filters button, .filters select, .filters input { font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; }
.filters input { min-width: min(230px, 100%); }
.filters button { cursor: pointer; } .filters button:hover { background: var(--panel2); }
.filters button.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
.filters button[disabled] { opacity: .4; cursor: not-allowed; }

/* dump summary */
.verdict { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.verdict .big { font: 700 64px/1 var(--mono); letter-spacing: -2px; font-variant-numeric: tabular-nums; }
.verdict .why { color: var(--muted); font-size: 14px; max-width: 46ch; margin-top: 6px; }
.fusion svg { width: 100%; height: auto; display: block; }
.fusion text { font-family: var(--mono); }
.formula { font: 12.5px var(--mono); color: var(--muted); margin-top: 10px; overflow-wrap: anywhere; }
.stat .num { font: 700 32px/1.1 var(--mono); letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.stat .lab { color: var(--muted); margin-top: 6px; font-size: 13.5px; }
.stat .sub { font: 11.5px var(--mono); color: var(--faint); margin-top: 6px; }
.strip { display: flex; gap: 26px; flex-wrap: wrap; align-items: center; }
.strip .k { font: 10.5px var(--mono); letter-spacing: 1.2px; text-transform: uppercase; color: var(--faint); }
.strip .v { font: 700 20px var(--mono); }
.report { line-height: 1.65; font-size: 15px; }
.report h2, .report h3, .report h4, .report h5 { margin: 22px 0 8px; font-family: inherit; text-transform: none; letter-spacing: 0; color: var(--text); font-size: 17px; }
.report table { margin: 10px 0; display: block; overflow-x: auto; } .report hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.report code { background: var(--panel2); border-radius: 5px; padding: 1px 6px; font: 13px var(--mono); }
.report ul { padding-left: 22px; } .report li { margin: 4px 0; } .report p { max-width: 90ch; }

/* ATT&CK */
.tactics { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.tactic h3 { font: 600 11px var(--mono); letter-spacing: 1.3px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.tech { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 8px; background: color-mix(in srgb, var(--bad) 7%, transparent); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.tech b { display: block; font-size: 13.5px; } .tech .id { font: 600 11.5px var(--mono); color: var(--accent2); }
.tech .refs { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
.empty { color: var(--faint); font-size: 13px; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 8px; }

/* red team */
.rtchart svg { width: 100%; height: auto; display: block; }
.rtchart text { font-family: var(--mono); }
.sq { display: inline-block; width: 16px; height: 16px; border-radius: 4px; margin-right: 3px; vertical-align: middle; border: 2px solid transparent; }
.sq.win { background: var(--bad); } .sq.lose { background: color-mix(in srgb, var(--accent) 65%, var(--bg)); } .sq.flag { border-color: var(--warn); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 0; padding: 7px 14px; cursor: pointer; }
.seg button.on { color: var(--text); background: var(--panel2); box-shadow: inset 0 -2px 0 var(--accent); }

/* progress */
.gt { display: inline-block; font-size: 12.5px; padding: 2px 7px; margin: 2px 3px 2px 0; border-radius: 6px; white-space: nowrap; background: var(--panel2); }
.realmw { display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: center; }
.realmw > p { flex: 1 1 360px; min-width: 0; }
.rmstats { display: flex; gap: 10px; flex-wrap: wrap; order: 2; }
.rmstat { background: var(--panel2); border-radius: 10px; padding: 12px 16px; min-width: 120px; }
.rmstat b { display: block; font: 700 26px var(--mono); color: var(--accent); }
.rmstat span { font-size: 12.5px; color: var(--muted); }
.mtable { table-layout: fixed; width: 100%; min-width: 640px; } .mtable td { overflow-wrap: anywhere; }
.clickrow { cursor: pointer; } .clickrow:hover td { background: var(--panel2); }
.gt.ok { color: var(--accent); } .gt.no { color: var(--bad); }
.ring { position: relative; flex: none; width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--c, var(--accent)) calc(var(--p) * 1%), var(--panel2) 0); }
.ring i { position: absolute; inset: 7px; border-radius: 50%; background: var(--bg2); }
.ring b { position: relative; font: 700 17px var(--mono); }
.rowflex { display: flex; align-items: center; gap: 16px; }
.ws ul { padding: 0; margin: 10px 0 0; } .ws li { list-style: none; display: flex; gap: 9px; padding: 4px 0; color: var(--muted); font-size: 13.5px; }
.ws li.done { color: var(--text); } .ws li em { font-style: normal; font-family: var(--mono); color: var(--accent); width: 14px; flex: none; } .ws li.todo em { color: var(--warn); }
.timeline { position: relative; padding-left: 26px; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--accent), transparent); }
.tl { position: relative; padding: 0 0 16px; } .tl:last-child { padding-bottom: 0; }
.tl::before { content: ""; position: absolute; left: -26px; top: 4px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
.tl.todo::before { border-color: var(--warn); border-style: dashed; } .tl.next::before { border-color: var(--accent2); }
.tl b { display: block; } .tl span { color: var(--muted); font-size: 13px; }

/* finding drawer */
.drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(440px, 100vw); z-index: 20; background: var(--bg2); border-left: 1px solid var(--line);
  box-shadow: -20px 0 50px rgba(0,0,0,.35); padding: 22px; overflow-y: auto; transform: translateX(105%); transition: transform .2s ease; display: grid; gap: 14px; align-content: start; }
.drawer.open { transform: none; }
.drawer .x { justify-self: end; font: 600 12px var(--mono); color: var(--muted); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
.drawer dl { display: grid; grid-template-columns: 100px 1fr; gap: 8px 12px; margin: 0; font-size: 13.5px; }
.drawer dt { color: var(--faint); font: 11px var(--mono); text-transform: uppercase; letter-spacing: 1px; padding-top: 2px; }
.drawer dd { margin: 0; word-break: break-word; }
.drawer .big { font-size: 17px; font-weight: 600; line-height: 1.4; }
.linkbtn { font: 600 12.5px var(--sans); color: var(--accent); background: transparent; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 8px; padding: 7px 12px; cursor: pointer; justify-self: start; }

/* board extras */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; padding: 0; }
.kpi { padding: 16px 18px; border-left: 1px solid var(--line2); min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi .v { font: 700 26px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.kpi .k { font: 600 10.5px var(--mono); letter-spacing: 1.2px; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
.kpi .s { font-size: 12px; color: var(--muted); margin-top: 4px; }
.toplist { display: grid; gap: 2px; }
.topitem { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start; padding: 9px 8px; border-radius: 9px; cursor: pointer; text-align: left; font: inherit; color: inherit; background: transparent; border: 0; width: 100%; }
.topitem:hover { background: var(--panel2); }
.topitem .t { font-size: 13.5px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.topitem .d { grid-column: 2; font: 11px var(--mono); color: var(--faint); }
.cmat { border-collapse: separate; border-spacing: 0 2px; }
.cmat td, .cmat th { border: 0; padding: 6px 8px; text-align: center; }
.cmat td:first-child, .cmat th:first-child { text-align: left; }
/* one row per dump, so the table grows down; past ~9 dumps it scrolls with the header pinned */
.cscroll { max-height: 400px; overflow-y: auto; }
.cmat thead th { position: sticky; top: 0; background: var(--bg2); border-bottom: 1px solid var(--line); z-index: 1; font-size: 10.5px; white-space: nowrap; }
.cscroll .cmat td, .cscroll .cmat th { padding: 6px 5px; }
.cdump { display: inline-block; max-width: 15ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; font-size: 13px; }
.dot { display: inline-block; border-radius: 50%; vertical-align: middle; }

/* pipeline diagram: top-down flow */
.flow { position: relative; display: grid; gap: 0; }
.step:not(:last-of-type)::before, .hand::before { content: ""; position: absolute; left: 17px; width: 2px; background: var(--accent); opacity: .4; }
.step:not(:last-of-type)::before { top: 36px; bottom: 0; }
.hand::before { top: 0; bottom: 0; }
.step { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 16px; position: relative; }
.node { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--mono);
  color: var(--accent); background: var(--bg2); border: 2px solid var(--accent); position: relative; z-index: 1; }
.shead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; min-height: 36px; padding-top: 7px; margin-bottom: 8px; }
.shead b { font: 600 12px var(--mono); letter-spacing: 1.4px; text-transform: uppercase; color: var(--text); }
.shead small { color: var(--muted); font-size: 13px; }
.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px 11px 15px; display: grid; gap: 4px; align-content: start; position: relative; overflow: hidden; min-width: 0; }
.stage::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c, var(--accent)); opacity: .9; }
.stage .sn { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.stage b { font-size: 13.5px; }
.stage .how { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.stage .out { font: 11px var(--mono); color: var(--faint); }
.stage .cnt { font: 600 11px var(--mono); color: var(--c, var(--accent)); background: var(--panel2); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
.hand { position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 16px; align-items: center; padding: 6px 0; }
.hand i { justify-self: center; width: 16px; height: 16px; background: var(--accent); position: relative; z-index: 1;

<script>
const SEV = ["critical", "high", "medium", "low", "info"];
const TACTICS = ["Execution", "Defense Evasion", "Credential Access", "Command and Control", "Impact"];
const TABS = {
  board: ["Board", "all", "Every analysed dump side by side"], redteam: ["Red team", "all", "Prompt-injection attacks against the LLM report, before and after the defences"],
  roadmap: ["Progress", "all", "What is built and what is left"],
  validation: ["Validation", "all", "How we know the detectors are right, and every key recovered from memory"],
  methods: ["Methods", "all", "How every score is computed, and the standard each rule rests on"],
  summary: ["Summary", "dump", "How the risk score was built and what to act on"], crypto: ["Cryptography", "dump", "Ciphers, RSA keys and credentials found in memory"],
  attack: ["ATT&CK", "dump", "Findings mapped to MITRE ATT&CK techniques"], findings: ["Findings", "dump", "Every finding, filterable"],
  report: ["Report", "dump", "The generated report, with clickable citations"],
};
let D = {dumps: [], rounds: [], techniques: {}};
let cur = null, tab = "board", filterSev = "all", filterMod = "all", query = "", highlight = null, reportKind = "llm", roundIdx = -1;

const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const refNum = (r) => parseInt(String(r).replace(/\D/g, ""), 10) || 0;
const empty = {id: "", meta: {}, findings: [], scores: {risk: 0, band: "none", compromise: 0, exposure: 0, reliability: 0.5}, breakdown: [], matrix: {}, report_llm: "", report_rules: "", llm_check: null};
const dump = () => D.dumps.find((d) => d.id === cur) || D.dumps[0] || empty;
const pct = (x) => Math.round(x * 100);
const sevOf = (s) => s >= 90 ? "critical" : s >= 70 ? "high" : s >= 40 ? "medium" : s > 0 ? "low" : "none";
const sevVar = (s) => `var(--${s === "none" ? "faint" : s})`;
const massSev = (m) => m >= 0.9 ? "critical" : m >= 0.75 ? "high" : m >= 0.5 ? "medium" : m > 0 ? "low" : "info";
const cite = (r) => `<a class="cite" data-ref="${esc(r)}">${esc(r)}</a>`;
const techName = (t) => (D.techniques[t] || [t])[0];
const store = {get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }};

function sevBar(fs) {
  const total = fs.length || 1;
  return `<div class="sevbar">${SEV.map((k) => `<span style="width:${fs.filter((f) => f.severity === k).length / total * 100}%;background:var(--${k})"></span>`).join("")}</div>`;
}
function ceBars(sc) {
  return `<div class="ce">
    <div class="r"><span>compromise</span><span class="track"><i style="width:${sc.compromise}%;background:var(--compromise)"></i></span><b>${sc.compromise}</b></div>
    <div class="r"><span>exposure</span><span class="track"><i style="width:${sc.exposure}%;background:var(--exposure)"></i></span><b>${sc.exposure}</b></div></div>`;
}
function ring(p, text, color) { return `<div class="ring" style="--p:${p};--c:${color || "var(--accent)"}"><i></i><b>${text}</b></div>`; }

/* ---------- sidebar and header ---------- */
function renderSide() {
  $("dumps").innerHTML = D.dumps.map((d) => `<button class="dumpbtn ${d.id === dump().id ? "on" : ""}" data-dump="${d.id}">
    <span class="t">${esc(d.meta.title || d.id)}</span>
    <span class="s"><span>${d.findings.length} findings</span><span style="color:${sevVar(d.scores.band)}">risk ${d.scores.risk}</span></span></button>`).join("");
  bindPicker($("dumps"));
}
function renderHeader() {
  const [name, scope, sub] = TABS[tab];
  $("title").textContent = scope === "dump" ? `${dump().meta.title || dump().id}` : name;
  $("subtitle").textContent = scope === "dump" ? `${name}: ${sub}` : sub;
  $("scope").className = "pill" + (scope === "all" ? " all" : "");
  $("scope").textContent = scope === "all" ? `${D.dumps.length} DUMPS` : (dump().meta.os || "").toUpperCase() || "DUMP";
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
}
function renderDumpViews() { renderSide(); renderHeader(); renderSummary(); renderCrypto(); renderAttack(); renderFindings(); renderReport(); renderBoard(); }
function bindPicker(root) {
  root.querySelectorAll("[data-dump]").forEach((b) => b.onclick = () => {
    cur = b.dataset.dump; highlight = null; closeDrawer();
    renderDumpViews();
    if (TABS[tab][1] === "all" && root.id !== "dumps") show("summary");
  });
}

/* ---------- Board ---------- */
function tacticCount(d, t) { return new Set(Object.values(d.matrix[t] || {}).flat()).size; }
const STAGES = [
  ["Evidence in", "What goes in. Nothing is ever executed.", "raw bytes", [
    ["Memory image", "Raw, .mem, .vmem, crash dump or VM core, opened read-only.", "the dump", "info", null],
    ["Network capture", "Optional .pcap from the same incident.", "packets", "info", null]]],
  ["Extract", "Pull processes and suspicious code out of memory.", "processes, injected regions, dumped files", [
    ["Volatility 3", "pslist, cmdline, netscan and malfind; injected regions are dumped to disk.", "processes, injected code", "compromise", "memory"],
    ["Static analysis", "pefile headers, YARA rules and entropy on every dumped region.", "packed or malicious code", "compromise", "static"]]],
  ["Crypto and secrets", "Four checks run side by side on the extracted data.", "findings with a CVSS band", [
    ["Cipher ID", "S-box and constant signatures, combined by Dempster's rule.", "AES, DES, ChaCha20, ECC…", "exposure", "crypto"],
    ["RSA keys", "DER/PEM/CAPI parsing; small factor, Fermat and shared-prime tests; NIST SP 800-57 strength; private key rebuilt from primes left in ransomware memory.", "broken or weak keys", "exposure", "rsa"],
    ["Credentials", "JWT, OAuth and OTP secrets, judged against RFC 8725 and RFC 4226.", "leaked tokens", "exposure", "credentials"],
    ["Network", "pyshark: TLS versions and cipher suites against RFC 8996 and SP 800-52.", "weak protocols", "exposure", "network"]]],
  ["Score", "Turn the findings into numbers and techniques.", "scores, ATT&CK ids, citation ids", [
    ["Evidence fusion", "CVSS band masses; strongest finding per source; Dempster's rule across sources.", "compromise, exposure, overall", "accent", null],
    ["ATT&CK mapping", "Each finding mapped to MITRE ATT&CK, prompt injection to ATLAS.", "techniques", "accent", null]]],
  ["Report", "Store everything and write the analyst report.", null, [
    ["Evidence store", "SQLite, every finding gets a citation id like F12.", "findings F1…Fn", "accent2", null],
    ["Defended LLM report", "Sanitised input, mandatory citations, numeric cross-check, one retry.", "report + validation", "accent2", null]]],
];
function pipelineHtml(d) {
  const by = {}; d.findings.forEach((f) => { by[f.module] = (by[f.module] || 0) + 1; });
  const col = {info: "var(--faint)", compromise: "var(--compromise)", exposure: "var(--exposure)", accent: "var(--accent)", accent2: "var(--accent2)"};
  const name = esc(d.meta.title || d.id);
  return `<div class="flow">${STAGES.map(([head, blurb, hand, items], i) => `<div class="step"><span class="node">${i + 1}</span><div>
      <div class="shead"><b>${head}</b><small>${esc(blurb)}</small></div>
      <div class="stages">${items.map(([n, how, out, c, mod]) => `<div class="stage" style="--c:${col[c]}">
        <div class="sn"><b>${esc(n)}</b>${mod ? `<span class="cnt" title="findings from this stage in ${name}">${by[mod] || 0} found</span>` : ""}</div>
        <div class="how">${esc(how)}</div><div class="out">→ ${esc(out)}</div></div>`).join("")}</div></div></div>
    ${hand ? `<div class="hand"><i></i><span>passes on: ${esc(hand)}</span></div>` : ""}`).join("")}</div>
    <div class="pipe-foot"><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--compromise);margin-right:6px"></i>feeds the compromise score</span>
      <span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--exposure);margin-right:6px"></i>feeds the crypto exposure score</span>
      <span>"found" counts are for ${name}.</span></div>`;
}
// short column labels so every cipher fits; the full name is in the tooltip
const CSHORT = {"ECC P-256": "P-256", "ECC secp256k1": "k1", "Curve25519": "25519", "ChaCha20/Salsa20": "ChaCha", "AES-GCM": "GCM", "DES/3DES": "DES"};
function cipherRows() {
  const names = {}, per = {};
  D.dumps.forEach((d) => d.findings.filter((f) => f.kind === "algorithm").forEach((f) => {
    const m = f.title.match(/^(.+?) identified \(([\d.]+)%, ([^)]+)\)/);
    if (!m || m[1] === "generic") return;
    names[m[1]] = Math.max(names[m[1]] || 0, +m[2]);
    per[d.id + "|" + m[1]] = {conf: +m[2], impl: m[3].startsWith("implementation"), ref: f.ref};
  }));
  return [Object.keys(names).sort((a, b) => names[b] - names[a]).slice(0, 7), per];
}
/* ---------- Campaigns: dumps linked by shared attacker evidence ---------- */
const linkIcon = `<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="vertical-align:-2px;margin-right:6px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>`;
const title = (id) => { const d = D.dumps.find((x) => x.id === id); return d ? (d.meta.title || id) : id; };
function linkedTo(id) {
  const c = ((D.campaigns || {}).campaigns || []).find((g) => g.includes(id));
  return c ? c.filter((x) => x !== id) : [];
}
function campaignHtml() {
  const C = D.campaigns || {pairs: [], campaigns: []}, linked = C.pairs.filter((p) => p.linked);
  const intro = `Dumps are linked when the attacker evidence they share adds up to ${C.threshold || 2.5} or more. Each shared indicator counts by type (process 3, code 3, key 3, IP 2, pattern 1) times its rarity ln((N+1)/df) across the ${D.dumps.length} dumps, so what every Windows host has counts for almost nothing.`;
  return `<h2>Campaigns</h2>
    <div class="card campcard"><p class="muted" style="margin:0 0 12px;font-size:13.5px">${intro}</p>
    ${linked.length ? linked.map((p) => `<div class="camp"><div class="camphd">${linkIcon}<b>${esc(title(p.a))}</b><span class="muted"> and </span><b>${esc(title(p.b))}</b><span class="campscore">${p.score.toFixed(1)}</span></div>
      <ul>${p.shared.map((x) => `<li><span class="mono">${x.weight.toFixed(1)}</span> ${esc(x.label)}</li>`).join("")}</ul></div>`).join("")
      : '<p class="muted">No two dumps share enough attacker evidence to be linked.</p>'}
    ${C.pairs.filter((p) => !p.linked).length ? `<p class="muted" style="margin:10px 0 0;font-size:12.5px">${C.pairs.filter((p) => !p.linked).length} other pair(s) share some evidence but stay under the threshold.</p>` : ""}
    </div>`;
}
function renderBoard() {
  const last = D.rounds[D.rounds.length - 1];
  const all = D.dumps.flatMap((d) => d.findings.map((f) => ({...f, dump: d})));
  const rsa = all.filter((f) => f.kind === "rsa_key"), broken = rsa.filter((f) => /broken/.test(f.title)).length;

/* ---------- Summary: evidence fusion ---------- */
function fusionSvg(d) {
  const sc = d.scores, rows = d.breakdown;
  const pick = (h) => rows.filter((r) => r.hypothesis === h).slice(0, 4);
  const left = [...pick("compromise"), ...pick("exposure")];
  const H = 34, G = 10, W = 640;
  const n = Math.max(left.length, 2), height = Math.max(n * (H + G) + 20, 200);
  const cy = {compromise: height * 0.3, exposure: height * 0.72};
  const col = {compromise: css("--compromise"), exposure: css("--exposure")}, faint = css("--faint"), text = css("--text"), muted = css("--muted"), panel = css("--bg2"), line = css("--line");
  let s = `<svg viewBox="0 0 ${W} ${height}" role="img" aria-label="Evidence fusion from sources to the overall risk">`;
  left.forEach((r, i) => {
    const y = 10 + i * (H + G), c = css("--" + massSev(r.mass)), yc = y + H / 2, ty = cy[r.hypothesis];
    s += `<path d="M210 ${yc} C 260 ${yc}, 260 ${ty}, 300 ${ty}" stroke="${c}" stroke-opacity=".85" stroke-width="${1 + r.mass * 3}" fill="none"/>`;
    s += `<rect x="0" y="${y}" width="210" height="${H}" rx="7" fill="${panel}" stroke="${c}"/>`;
    s += `<text x="10" y="${y + 15}" font-size="11" fill="${text}">${esc(r.source.length > 24 ? r.source.slice(0, 23) + "…" : r.source)}</text>`;
    s += `<text x="10" y="${y + 28}" font-size="10" fill="${muted}">${r.count} finding${r.count > 1 ? "s" : ""} · top ${esc(r.ref)}</text>`;
    s += `<text x="200" y="${y + 21}" font-size="12" font-weight="700" fill="${c}" text-anchor="end">${r.mass.toFixed(2)}</text>`;
  });
  if (!left.length) s += `<text x="0" y="40" font-size="12" fill="${faint}">No finding above info severity.</text>`;
  ["compromise", "exposure"].forEach((h) => {
    const y = cy[h], v = sc[h];
    s += `<path d="M440 ${y} C 480 ${y}, 480 ${height / 2}, 515 ${height / 2}" stroke="${col[h]}" stroke-width="${h === "exposure" ? 2 : 3}" ${h === "exposure" ? 'stroke-dasharray="5 4"' : ""} fill="none"/>`;
    s += `<rect x="300" y="${y - 26}" width="140" height="52" rx="9" fill="${panel}" stroke="${col[h]}"/>`;
    s += `<text x="312" y="${y - 7}" font-size="10" fill="${muted}" letter-spacing="1">${h === "exposure" ? "EXPOSURE ×" + sc.reliability : "COMPROMISE"}</text>`;
    s += `<text x="312" y="${y + 16}" font-size="20" font-weight="700" fill="${text}">${v}</text>`;
  });
  const oc = css("--" + (sc.band === "none" ? "faint" : sc.band));
  s += `<rect x="515" y="${height / 2 - 38}" width="122" height="76" rx="11" fill="${panel}" stroke="${oc}" stroke-width="2"/>`;
  s += `<text x="528" y="${height / 2 - 16}" font-size="10" fill="${muted}" letter-spacing="1">OVERALL</text>`;
  s += `<text x="528" y="${height / 2 + 20}" font-size="32" font-weight="700" fill="${oc}">${sc.risk}</text>`;
  s += `<line x1="0" y1="${height - 1}" x2="${W}" y2="${height - 1}" stroke="${line}"/>`;
  return s + "</svg>";
}

/* ---------- Cryptography ---------- */
function renderCrypto() {
  const fs = dump().findings;
  const algos = fs.filter((f) => f.kind === "algorithm").map((f) => {
    const m = f.title.match(/^(.+?) identified \(([\d.]+)%, ([^)]+)\)/);
    return m ? {ref: f.ref, name: m[1], conf: parseFloat(m[2]), basis: m[3]} : null;
  }).filter(Boolean).sort((a, b) => b.conf - a.conf);
  const groups = {};
  fs.filter((f) => f.kind === "rsa_key").forEach((f) => {
    const m = f.title.match(/^RSA-(\d+) key e=(\d+) \(([^)]+)\), strength (\d+)\/100(?: \(([^)]*)\))?:? ?(.*)$/);
    if (!m) return;
    const k = `${m[1]}|${m[2]}|${m[4]}|${m[5]}|${m[6]}`;
    (groups[k] = groups[k] || {bits: +m[1], e: +m[2], strength: +m[4], status: m[5] || "", issue: m[6] || "", refs: [], sev: f.severity}).refs.push(f.ref);
  });
  const rsa = Object.values(groups).sort((a, b) => a.strength - b.strength || b.refs.length - a.refs.length);
  const rsaSum = fs.find((f) => f.kind === "rsa_summary"), ent = fs.find((f) => f.kind === "entropy");
  const creds = fs.filter((f) => f.module === "credentials");
  const basisTag = (b) => `<span class="tag ${b.startsWith("implementation") ? "ok" : ""}">${esc(b)}</span>`;
  $("crypto").innerHTML = `
    <h2 style="margin-top:0">Cipher identification</h2>
    <div class="card tablewrap">${algos.length ? `<table>
      <tr><th>Algorithm</th><th style="width:36%">Confidence</th><th>Evidence basis</th><th>Finding</th></tr>
      ${algos.map((a) => `<tr><td><b>${esc(a.name)}</b></td>
        <td><div class="conf"><div class="meter"><i style="width:${a.conf}%"></i></div><span class="v">${a.conf.toFixed(1)}%</span></div></td>
        <td>${basisTag(a.basis)}</td><td class="ref">${cite(a.ref)}</td></tr>`).join("")}
    </table>` : `<p class="muted" style="margin:0">No cipher signatures found.</p>`}
    <p class="note">Confidence is Dempster's rule over the matched signatures, 1 − ∏(1 − wᵢ). "Implementation constants" means the cipher is implemented here; "API/string references only" means it is only named.</p></div>

    <h2>RSA keys found in memory</h2>

/* ---------- Report (small markdown renderer) ---------- */
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
    .replace(/[\[【]F(\d+)[\]】]/g, (m, n) => `<a class="cite" data-ref="F${n}">[F${n}]</a>`);
}
function markdown(src) {
  src = (src || "").replace(/[​⁠]/g, "");
  const lines = src.split(/\r?\n/), out = [];
  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].trim();
    if (!t) continue;
    if (/^-{3,}$/.test(t)) { out.push("<hr>"); continue; }
    const h = t.match(/^(#{1,4})\s+(.*)$/);
    if (h) { out.push(`<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`); continue; }
    if (t.startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(lines[i].trim()); i++; }
      i--;
      const cells = (r) => r.replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const body = rows.filter((r) => !/^\|[\s:|-]+\|?$/.test(r));
      out.push("<table>" + body.map((r, k) => "<tr>" + cells(r).map((c) => k === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</table>");
      continue;
    }
    if (/^[-*]\s+/.test(t)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++; }
      i--;
      out.push("<ul>" + items.map((x) => `<li>${inline(x)}</li>`).join("") + "</ul>");
      continue;
    }
    out.push(`<p>${inline(t)}</p>`);
  }
  return out.join("\n");
}

function rtChart(rounds, compact) {
  const rows = rounds.flatMap((r) => [[r.name + " plain", r.stats.asr_base, r.stats.n, r.stats.wilson_base, "--bad"], [r.name + " defended", r.stats.asr_def, r.stats.n, r.stats.wilson_def, "--accent"]]);
  const W = 560, L = 150, R = 60, top = 8, rowH = compact ? 26 : 32, max = 0.4, H = top + rows.length * rowH + 26;
  const x = (v) => L + (W - L - R) * Math.min(v, max) / max;
  const text = css("--text"), muted = css("--faint"), grid = css("--line");
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Attack success with 95% Wilson intervals">`;
  [0, 0.1, 0.2, 0.3, 0.4].forEach((t) => { s += `<line x1="${x(t)}" y1="${top}" x2="${x(t)}" y2="${H - 22}" stroke="${grid}"/><text x="${x(t)}" y="${H - 6}" font-size="10" fill="${muted}" text-anchor="middle">${t * 100}%</text>`; });
  rows.forEach(([lab, k, n, w, c], i) => {
    const y = top + i * rowH + rowH / 2, col = css(c), p = n ? k / n : 0;
    s += `<text x="0" y="${y + 4}" font-size="11" fill="${text}">${esc(lab)}</text>`;
    s += `<rect x="${L}" y="${y - 6}" width="${Math.max(0, x(p) - L)}" height="12" rx="3" fill="${col}" fill-opacity=".55"/>`;
    s += `<line x1="${x(w[0])}" y1="${y}" x2="${x(w[1])}" y2="${y}" stroke="${col}" stroke-width="2"/>`;
    s += `<line x1="${x(w[0])}" y1="${y - 6}" x2="${x(w[0])}" y2="${y + 6}" stroke="${col}" stroke-width="2"/><line x1="${x(w[1])}" y1="${y - 6}" x2="${x(w[1])}" y2="${y + 6}" stroke="${col}" stroke-width="2"/>`;
    s += `<text x="${W}" y="${y + 4}" font-size="11" fill="${text}" text-anchor="end">${k}/${n}</text>`;
  });
  return `<div class="rtchart">${s}</svg></div>`;
}

      ["Other ChaCha20 states in the control processes", String(B.chacha_control_other_keys), "One per process: Python 3.13's allocator (mimalloc) seeds its PRNG with a real ChaCha20 state. A true hit, just not the program's key"],
    ] : []),
    ["RSA private key from primes, key in use", r(B.rsa_live_recovered), "OpenSSL keeps p and q as 64-bit limbs; rebuilt from the public key alone"],
    ["RSA private key after the key is freed", r(B.rsa_freed_recovered), "OpenSSL clears the primes on free, unlike Windows 7 CryptoAPI in the WannaCry dump"],
  ];
  return `<h2>Benchmark: processes we control</h2>
    <div class="card tablewrap"><p class="muted" style="margin:0 0 10px;font-size:13.5px">Processes we start ourselves with a known cipher and a fresh synthetic key, ${B.trials} trials each, read from memory and run through the same detectors. Run it again with <code>python -m triageguard benchmark</code> (Linux or WSL).</p>
    <table><tr><th>Check</th><th>Result</th><th>What it shows</th></tr>${rows.map((x) => `<tr><td>${x[0]}</td><td class="mono" style="white-space:nowrap">${x[1]}</td><td class="muted" style="font-size:13px">${x[2]}</td></tr>`).join("")}</table></div>`;
}
const CHECKS = {key_scanned: "picked for key scan", cipher_identified: "cipher identified", aes_key_recovered: "AES key recovered",
  chacha20_key_recovered: "ChaCha20 key recovered", rsa_private_key_recovered: "RSA private key rebuilt", small_e_flagged: "e=3 flagged"};
const tick = (ok, label) => `<span class="gt ${ok === null ? "" : ok ? "ok" : "no"}">${ok === null ? "~" : ok ? "✓" : "✗"} ${esc(label)}</span>`;
function labHtml(d) {
  const G = d.ground_truth;
  return `<div class="card tablewrap"><h3>${esc(d.meta.title || d.id)} <span class="mono" style="color:${G.passed === G.checks ? "var(--accent)" : "var(--bad)"}">${G.passed}/${G.checks}</span></h3>
    <p class="muted" style="margin:0 0 10px;font-size:13.5px">We started these processes inside the VM with fresh random keys and wrote the answers down before the capture${G.kernel ? ` (kernel ${esc(G.kernel)})` : ""}. The full pipeline then ran on the dump with no access to the answers.</p>
    <table><tr><th>Process</th><th>Planted</th><th>Checks</th><th>Other keys</th></tr>${G.cases.map((c) => `<tr><td class="mono">${esc(c.process)} <span class="muted">${c.pid}</span></td><td>${esc(c.planted === "none" ? "nothing (control)" : c.planted)}</td>
      <td>${c.planted === "none" ? tick(!c.false_alarm, "no false alarm") : Object.keys(CHECKS).filter((k) => k in c).map((k) => tick(c[k], CHECKS[k])).join(" ")}</td>
      <td class="mono muted">${c.other_aes_keys || ""}</td></tr>`).join("")}</table>
    ${G.cases.some((c) => c.other_aes_keys) ? '<p class="note">Other keys: extra AES-256 schedules in the RSA processes, from OpenSSL\'s random generator (CTR-DRBG). They are real AES keys, just not ones we planted.</p>' : ""}</div>`;
}
const KEY_RE = /^(\S+) (?:private )?key of (.+?) \(PID (\d+)\) recovered from (.+?) at (0x[0-9a-f]+)/;
function keyRows() {
  return D.dumps.flatMap((d) => recovered(d.findings).map((f) => {
    const m = KEY_RE.exec(f.title) || [];
    const cipher = m[1] || f.title.split(" ")[0], proc = m[2] || "", pid = +(m[3] || 0), how = m[4] || "";
    const proof = f.kind === "key_recovered" ? "prime divides n, round trip"
      : f.kind === "aes_key" ? "full key schedule matches"
      : /confirmed against its keystream/.test(f.title) ? "keystream matches" : "context layout";
    const gt = d.ground_truth && d.ground_truth.cases.find((c) => c.pid === pid);
    const planted = gt ? ((/^AES/.test(cipher) && /^AES/.test(gt.planted) && gt.aes_key_recovered && proc === gt.process)
      || (/^ChaCha20|^Salsa20/.test(cipher) && gt.chacha20_key_recovered) || (/^RSA/.test(cipher) && gt.planted === "RSA")) : false;
    return {d, f, cipher, proc, pid, how, proof, source: d.ground_truth ? (planted ? "planted" : "not planted") : "real dump"};
  }));
}
function keysHtml() {
  const rows = keyRows();
  if (!rows.length) return "";
  return `<h2>Every key recovered from memory</h2>
    <div class="card tablewrap"><p class="muted" style="margin:0 0 10px;font-size:13.5px">${rows.length} keys across ${new Set(rows.map((r) => r.d.id)).size} dumps. Key material is never stored, only a short fingerprint. Click a row for the finding.</p>
    <table><tr><th>Key</th><th>Process</th><th>Dump</th><th>Found in</th><th>Proof</th><th>Source</th></tr>${rows.map((r) => `<tr class="clickrow" data-open="${r.d.id}|${r.f.ref}">
      <td class="mono" style="white-space:nowrap">${esc(r.cipher)}</td><td class="mono">${esc(r.proc)} <span class="muted">${r.pid || ""}</span></td>
      <td>${esc(r.d.meta.title || r.d.id)}</td><td class="muted" style="font-size:13px">${esc(r.how)}</td>
      <td style="white-space:nowrap">${tick(r.proof === "context layout" ? null : true, r.proof)}</td>
      <td style="white-space:nowrap" class="muted">${esc(r.source)}</td></tr>`).join("")}</table></div>`;
}
const METHOD_GROUPS = [
  ["Risk scoring", ["Finding mass", "Weak public-only key", "Compromise, Crypto exposure 0-100", "Overall risk 0-100", "Risk band", "Score range"]],
  ["Cryptography", ["Entropy region", "Cipher confidence", "AES from AES-GCM", "RSA security bits", "RSA broken", "RSA strength 0-100", "RSA status", "AES key found", "ChaCha20 / Salsa20 key found"]],
  ["Credentials and network", ["OTP secret", "JWT", "Weak TLS"]],
  ["Linking and the LLM report", ["Campaign link", "Attack success rate", "Defence effect", "Citation rate", "Cross-check"]],
];
const md = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>');
function renderMethods() {
  const M = D.methods || {rows: []}, used = new Set();
  const groups = METHOD_GROUPS.map(([name, keys]) => [name, M.rows.filter((r) => keys.includes(r.score) && used.add(r.score))]);
  const rest = M.rows.filter((r) => !used.has(r.score));
  if (rest.length) groups.push(["Other", rest]);
  $("methods").innerHTML = `
    <div class="card"><p style="margin:0">Every score is computed in code, never by the LLM. Each rule below names its formula, the published standard or paper it rests on, and the part that is our own choice because no standard covers it.</p>
      <div class="formula" style="margin-top:12px">overall risk = 1 − (1 − C)(1 − 0.5·E) · C = compromise, E = crypto exposure, each fused by Dempster's rule</div></div>
    ${groups.filter((g) => g[1].length).map(([name, rows]) => `<h2>${esc(name)}</h2>
      <div class="card tablewrap"><table class="mtable"><colgroup><col style="width:15%"><col style="width:38%"><col style="width:31%"><col style="width:16%"></colgroup><tr><th>Score</th><th>Formula</th><th>Based on</th><th>Our own choice</th></tr>${rows.map((r) => `<tr>
        <td style="font-weight:600">${esc(r.score)}</td><td style="font-size:13px">${md(r.formula)}</td><td class="muted" style="font-size:13px">${md(r.basis)}</td><td class="muted" style="font-size:13px">${md(r.choice)}</td></tr>`).join("")}</table></div>`).join("")}
    ${M.note ? `<p class="note">${md(M.note)}</p>` : ""}
    <p class="note">Full text, with what changed and why: docs/FORMULAS.md in the repository.</p>`;
}
function renderValidation() {
  const B = D.benchmark, labs = D.dumps.filter((d) => d.ground_truth);
  const passed = labs.reduce((s, d) => s + d.ground_truth.passed, 0), checks = labs.reduce((s, d) => s + d.ground_truth.checks, 0);
  const real = D.dumps.filter((d) => !d.ground_truth && d.findings.some((f) => f.kind === "key_recovered"));
  const rebuilt = real.flatMap((d) => d.findings.filter((f) => f.kind === "key_recovered").map((f) => ({...f, dump: d})));
  const live = B ? [B.aes_live_recall, B.chacha_live_recall, B.rsa_live_recovered].filter(Boolean) : [];
  const blobs = rebuilt.filter((f) => /private key blob/.test(f.title)).length, primes = rebuilt.length - blobs;
  const kpi = (k, v, sub) => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;
  $("validation").innerHTML = `
    <div class="card kpis">
      ${kpi("Lab checks passed", checks ? `${passed}/${checks}` : "n/a", `${labs.length} dump${labs.length === 1 ? "" : "s"} with planted keys`)}
      ${kpi("Live keys read back", live.length ? `${live.reduce((s, x) => s + x.hit, 0)}/${live.reduce((s, x) => s + x.n, 0)}` : "n/a", "benchmark, AES + ChaCha20 + RSA")}
      ${kpi("Keys rebuilt from real malware", rebuilt.length, real.map((d) => esc(d.meta.title || d.id)).join(", ") || "none yet")}
      ${kpi("False AES keys in controls", B ? B.aes_control_false_keys : "n/a", "8 MB of random bytes each")}
    </div>
    <h2>Lab dumps scored against planted keys</h2>
    ${labs.map(labHtml).join("") || '<p class="muted">No lab dump yet.</p>'}
    <h2>Real malware</h2>
    <div class="card realmw"><div class="rmstats">
        ${[[rebuilt.length, `RSA private key${rebuilt.length === 1 ? "" : "s"} rebuilt`], [blobs, "from CryptoAPI blobs"], [primes, "from leftover primes"]].map(([n, l]) => `<div class="rmstat"><b>${n}</b><span>${l}</span></div>`).join("")}
      </div><p class="muted" style="margin:0;font-size:13.5px">Every rebuilt key is checked twice: the prime found in memory divides the public modulus, and the rebuilt private key undoes what the public key encrypts. So a hit here cannot be a false positive. ${blobs ? `${blobs} came from CryptoAPI private-key blobs still in memory` : ""}${blobs && primes ? " and " : ""}${primes ? `${primes} from primes left behind after the key was used, the flaw WannaKiwi used against WannaCry on Windows 7` : ""}. Each one is in the table below.</p>
</div>
    ${keysHtml()}
    ${benchHtml()}
    <p class="note">Constraints: public datasets and synthetic keys and tokens only, no live malware execution, no real credentials.</p>`;
  $("validation").querySelectorAll("[data-open]").forEach((b) => b.onclick = () => {
    const [id, ref] = b.dataset.open.split("|");
    if (cur !== id) { cur = id; renderDumpViews(); }
    openDrawer(ref);
  });
}

function renderRoadmap() {
  const all = WORKSTREAMS.flatMap((w) => w[1]), done = all.filter((x) => x[1]).length, p = Math.round(done / all.length * 100);
  const last = D.rounds[D.rounds.length - 1];
  $("roadmap").innerHTML = `
    <div class="grid g4">
      <div class="card rowflex">${ring(p, p + "%")}<div><div class="label">Overall</div><div class="muted">${done} of ${all.length} tasks done</div></div></div>
      <div class="card stat"><div class="label">Public dumps</div><div class="num">${D.dumps.length}</div><div class="lab">${D.dumps.map((d) => esc(d.meta.title || d.id)).join(", ")}</div></div>
      <div class="card stat"><div class="label">LLM reports measured</div><div class="num">${D.rounds.reduce((s, r) => s + r.stats.reports, 0)}</div><div class="lab">${last ? `latest: ${last.stats.asr_base}/${last.stats.n} → ${last.stats.asr_def}/${last.stats.n}` : ""}</div></div>
      <div class="card stat"><div class="label">Automated tests</div><div class="num">61</div><div class="lab">all passing</div></div>
    </div>
    <h2>Workstreams</h2>
    <div class="grid g2">${WORKSTREAMS.map(([name, items]) => { const d = items.filter((x) => x[1]).length, q = Math.round(d / items.length * 100);
      return `<div class="card ws"><div class="rowflex">${ring(q, q + "%", q === 100 ? "var(--accent)" : "var(--accent2)")}<div><h3 style="margin:0">${name}</h3><span class="muted" style="font-size:13px">${d} of ${items.length} done</span></div></div>
        <ul>${items.map((x) => `<li class="${x[1] ? "done" : "todo"}"><em>${x[1] ? "✓" : "○"}</em>${esc(x[0])}</li>`).join("")}</ul></div>`; }).join("")}</div>
    <h2>Timeline</h2>
    <div class="card"><div class="timeline">${TIMELINE.map((t) => `<div class="tl ${t[2]}"><b>${esc(t[0])} ${t[2] === "next" ? '<span class="tag" style="color:var(--accent2)">next</span>' : t[2] === "todo" ? '<span class="tag flag">to do</span>' : ""}</b><span>${esc(t[1])}</span></div>`).join("")}</div></div>
    <p class="note">Constraints: public datasets and synthetic keys and tokens only, no live malware execution, no real credentials.</p>`;
}

/* ---------- tabs and theme ---------- */
function show(t) {
  tab = TABS[t] ? t : "board";
  document.querySelectorAll("main section").forEach((s) => s.classList.toggle("hidden", s.id !== tab));
  renderHeader();
  if (tab === "findings") renderFindings();
  store.set("tg-tab", tab);
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button[data-tab]").forEach((b) => b.onclick = () => show(b.dataset.tab));

cur = store.get("tg-dump");
reload(null, null).then(() => {
  if (!D.dumps.some((x) => x.id === cur)) { cur = (D.dumps[0] || {}).id; renderDumpViews(); }
  show(store.get("tg-tab") || "board");
}).catch((e) => { $("board").innerHTML = `<div class="card">Could not load data from the dashboard server: ${esc(e)}. Start it with <code>python -m triageguard dashboard</code>.</div>`; });
window.addEventListener("beforeunload", () => store.set("tg-dump", cur || ""));
</script>
</body>
</html>
